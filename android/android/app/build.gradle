apply plugin: 'com.android.application'

// Release signing. scripts-apk/build-apk.ps1 generates android/keystore.properties + the .jks on first run, so a
// plain `gradlew assembleRelease` produces an installable APK without any manual keytool steps. When the file is
// absent (e.g. a fresh checkout built by someone else) Gradle falls back to an unsigned release build.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "io.github.sganggs.strongholdprotocol"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "io.github.sganggs.strongholdprotocol"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The game's own version: keep in step with package.json (build-apk.ps1 checks and refuses a mismatch; the dist
        // artifact name is derived from package.json). versionCode = major*10000 + minor*100 + patch. ASCII only.
        versionCode 301
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    androidResources {
        // The APK carries ~700 MB of game art that the capacitor-nodejs plugin copies out of the APK into the app's
        // private storage (once per app update: FileOperations.CopyAsset uses AssetManager.open, a stream, so a
        // deflated entry is inflated transparently). These types are already compressed, so deflating them again would
        // only slow that copy down for no gain — measured on the 0.2.5 tree: .png 302 MB → 100.0 % of its size,
        // .mp3 192 MB → 99.5 %, .webp 9 MB → 100 %.
        // NOT excluded, because they do compress well (deflate -9, measured on the real files):
        //   .skel 151 MB → 20.7 % (~119 MB off the download), .bin 27 MB → 32.4 % (~19 MB)
        noCompress += ['png', 'jpg', 'jpeg', 'webp', 'gif', 'mp3', 'ogg', 'm4a', 'aac', 'woff2']
    }
    packaging {
        // `libnode.so` (91 MB) and the other two arm64 libraries: stored uncompressed they are mapped straight out of
        // the APK (the AGP default, android:extractNativeLibs="false"), which starts fastest but costs 92 MB of
        // download. Legacy packaging compresses them (~30 % of their size — ~64 MB off the download) and lets the
        // installer unpack them into /data/app/<pkg>/lib/arm64 on install (+92 MB on the device, a slower install).
        // Chosen for the smaller download; System.loadLibrary finds the extracted copy as it always did.
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        /**
         * A second, side-by-side TEST build (`scripts-apk/build-apk.ps1 -Variant devtest`, task `assembleDevtest`):
         * the same game with its own application id (…`.dev`) and its own launcher label
         * (src/devtest/res/values/strings.xml), signed with the same key, so it installs NEXT TO the release app
         * instead of replacing it. The staged server carries the debug console switched on
         * (`SP_CONSOLE=1`, DESIGN §21.33: every client of this app, LAN included) — the release build keeps the
         * server's own default (`auto`: loopback clients only). No other difference: same versionCode/versionName
         * (the version name gets a `-dev` suffix so the two are told apart on screen and by `aapt`).
         */
        devtest {
            initWith release
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
